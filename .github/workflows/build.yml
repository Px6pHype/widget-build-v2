name: Build APK

# Запуск: на каждый пуш в любую ветку + вручную с вкладки Actions.
# Если хотите собирать только main — замените на:
#   on:
#     push:
#       branches: [ main ]
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.x требует JDK 17 (в проекте compileOptions Java 17).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Версии связаны: AGP 8.7.3 рассчитан на Gradle 8.x — берём 8.9,
      # ту же, что указана в gradle-wrapper.properties, чтобы сборка
      # не зависела от предустановленного на раннере Gradle.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # SDK Platform 35 / build-tools при необходимости AGP скачает сам —
      # на GitHub-раннерах лицензии Android SDK уже приняты.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassWidgets-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
